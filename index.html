<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cafetería · Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef1ec;--ink:#1f2a24;--mut:#66726b;--card:#fff;--line:#d6ddd7;--acc:#1f5c4a;--pen:#c9801a;--ok:#2e8b57;--bad:#b3402f}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.55rem .85rem;cursor:pointer;min-height:40px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.x{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7fb8a4;outline-offset:1px}
input,select{border:1px solid var(--line);border-radius:8px;padding:.6rem;width:100%;background:#fff;min-height:42px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--acc)}
header.top{background:var(--ink);color:#fff;padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
header.top h1{font-size:1.2rem;margin:0;font-weight:800}header.top small{opacity:.7}
nav{display:flex;gap:.4rem;overflow-x:auto;padding:.6rem 1rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;border-radius:99px}nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:1rem}
.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}.bar b{margin-right:auto}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.card header{display:flex;justify-content:space-between;align-items:center;font-size:1.15rem}
.card ul{list-style:none;margin:0;padding:0}.card li{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:.3rem 0}
.card li label{display:flex;gap:.6rem;align-items:center;flex:1}.card li.done label{opacity:.55;text-decoration:line-through}
li em{font-style:normal;font-size:.8rem;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:0 .5rem}
.card footer{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}.card footer b{margin-right:auto;font-size:1.1rem}
.tag{font-size:.8rem;border-radius:99px;padding:.15rem .65rem;color:#fff}.pendiente{background:var(--pen)}.entregado{background:var(--ok)}.pagado{background:var(--mut)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:.7rem;text-align:left;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right}
.scroll{overflow-x:auto}.empty{color:var(--mut);padding:2rem 0;text-align:center}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0}.sheet footer.bar{position:sticky;bottom:-1rem;background:#fff;padding:.6rem 0;margin:0}
.prow{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:10px;padding:.45rem .6rem}.prow.on{border-color:var(--acc);background:#eaf4ef}
.prow span{flex:1}.prow small{display:block;color:var(--mut)}.prow b{min-width:1.6rem;text-align:center}.tk{display:flex;align-items:center;gap:.3rem;font-size:.85rem}
.seg{display:flex;gap:.5rem}.seg button{flex:1}.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.boards{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.box{border:2px dashed var(--line);border-radius:12px;padding:.6rem;min-height:90px;display:flex;flex-direction:column;gap:.4rem}.box h4{margin:0;display:flex;justify-content:space-between}
.box.pool{background:#f6f8f5}.chips{display:flex;flex-wrap:wrap;gap:.35rem;flex:1}
.chip{background:#fff;border:1px solid var(--acc);border-radius:99px;padding:.3rem .7rem;font-size:.9rem;cursor:grab;user-select:none}.chip.sel{background:var(--acc);color:#fff}
.big{font-size:1.6rem;font-weight:800}.chg{font-weight:600}.chg.neg{color:var(--bad)}
.login{max-width:360px;margin:12vh auto;padding:1.5rem;display:flex;flex-direction:column;gap:.8rem}.login h1{font-size:2rem;margin:0}.err{color:var(--bad);min-height:1.2em}
</style></head><body><div id="app"></div><div id="modal"></div>
<script>
// ===== CONFIGURACIÓN: pega aquí los datos de tu proyecto Supabase (Settings > API) =====
const SUPABASE_URL='https://egkspfelnrsumpzfdlbs.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVna3NwZmVsbnJzdW1wemZkbGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTc0NTYsImV4cCI6MjEwNjUzMzQ1Nn0.PHJZPk-E981l9RAg516_avPRqLKaK6btfQ796sadJRo';
const DOM='@cafeteria.app'; // los usuarios se crean como usuario@cafeteria.app
// ===== Niveles: para agregar uno nuevo, añade una línea con las pestañas que puede ver =====
const PERMS={admin:['pedidos','resumen','pagados','caja','productos'],mesero:['pedidos','resumen','pagados','caja']};
const TABS={pedidos:'En cola',resumen:'Por servir',pagados:'Pagados',caja:'Caja',productos:'Productos'};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(+n||0).toFixed(2);
let S={u:null,tab:'pedidos',prods:[],orders:[],items:[],pays:[],exps:[],d:null,p:null,sel:null};
const itemsOf=id=>S.items.filter(i=>i.order_id===id);
const total=id=>itemsOf(id).reduce((a,i)=>a+i.qty*i.price,0);
const status=o=>o.paid?'pagado':itemsOf(o.id).every(i=>i.delivered)?'entregado':'pendiente';
const can=t=>(PERMS[S.u.role]||PERMS.mesero).includes(t);
const fail=r=>{if(r&&r.error){alert('Error: '+r.error.message);return true}};
const wrap=h=>`<div class=ov><div class=sheet>${h}</div></div>`;
const closeM=()=>{$('#modal').innerHTML='';S.d=S.p=S.sel=null};

// ---------- Datos ----------
async function load(){
  const o=await sb.from('orders').select('*').is('shift_id',null).order('created_at'); if(fail(o))return;
  S.orders=o.data; const ids=S.orders.map(x=>x.id);
  const [i,p,pa,e]=await Promise.all([
    ids.length?sb.from('order_items').select('*').in('order_id',ids).order('id'):{data:[]},
    sb.from('products').select('*').order('category').order('name'),
    sb.from('payments').select('*').is('shift_id',null), sb.from('expenses').select('*').is('shift_id',null)]);
  S.items=i.data||[];S.prods=p.data||[];S.pays=pa.data||[];S.exps=e.data||[];
  render();
}
let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(load,250)};
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return login();
  const r=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(fail(r)||!r.data)return login('No se encontró el perfil del usuario.');
  S.u=r.data; await load();
  sb.channel('cafe').on('postgres_changes',{event:'*',schema:'public'},later).subscribe();
}
function login(msg=''){
  $('#app').innerHTML=`<div class=login><h1>Cafetería</h1><label>Usuario<input id=lu autocomplete=username autocapitalize=none></label>
  <label>Clave<input id=lp type=password autocomplete=current-password></label><div class=err id=le>${msg}</div><button class=pri data-act=in>Ingresar</button></div>`;
}

// ---------- Vistas ----------
function card(o){const it=itemsOf(o.id),st=status(o);
  return `<article class=card><header><b>${esc(o.table_name)}</b><span class="tag ${st}">${st}</span></header><ul>
  ${it.map(i=>`<li class="${i.delivered?'done':''}"><label><input type=checkbox data-act=tg data-id=${i.id} ${i.delivered?'checked':''}> ${i.qty}× ${esc(i.name)} <em>${i.take_away?'para llevar':'para servir'}</em></label><button class=x data-act=di data-id=${i.id} aria-label="Quitar">✕</button></li>`).join('')}</ul>
  <footer><b>${money(total(o.id))}</b><button data-act=add data-id=${o.id}>Agregar</button><button class=pri data-act=pay data-id=${o.id}>Pagar</button><button class=x data-act=do data-id=${o.id}>Eliminar</button></footer></article>`}
const cajaTot=()=>{const f=m=>S.pays.filter(p=>p.method===m).reduce((a,p)=>a+ +p.amount,0),ex=S.exps.reduce((a,x)=>a+ +x.amount,0);return{cash:f('efectivo'),tr:f('transferencia'),ex,box:f('efectivo')-ex}};
const sumBox=t=>`<table><tr><td>Pagos en efectivo</td><td class=n>${money(t.cash)}</td></tr><tr><td>Pagos por transferencia</td><td class=n>${money(t.tr)}</td></tr><tr><td>Retiros de caja (compras)</td><td class=n>−${money(t.ex)}</td></tr><tr><th>Efectivo que debe haber en caja</th><th class=n>${money(t.box)}</th></tr><tr><th>Total vendido</th><th class=n>${money(t.cash+t.tr)}</th></tr></table>`;
function view(){
  const t=S.tab;
  if(t==='pedidos'){const l=S.orders.filter(o=>!o.paid);return `<div class=bar><b>${l.length} pedido(s) en cola</b><button class=pri data-act=new>+ Nuevo pedido</button></div>${l.length?`<div class=grid>${l.map(card).join('')}</div>`:'<p class=empty>No hay pedidos en cola. Crea uno con “Nuevo pedido”.</p>'}`}
  if(t==='resumen'){const g={};S.items.filter(i=>!i.delivered&&!S.orders.find(o=>o.id===i.order_id)?.paid).forEach(i=>{const r=g[i.name]||(g[i.name]={s:0,l:0});r[i.take_away?'l':'s']+=i.qty});
    const k=Object.keys(g).sort();return `<div class=bar><b>Pendiente por entregar, sumando todos los pedidos</b></div>${k.length?`<div class=scroll><table><tr><th>Producto</th><th class=n>Servir</th><th class=n>Llevar</th><th class=n>Total</th></tr>${k.map(n=>`<tr><td>${esc(n)}</td><td class=n>${g[n].s}</td><td class=n>${g[n].l}</td><td class=n><b>${g[n].s+g[n].l}</b></td></tr>`).join('')}</table></div>`:'<p class=empty>No hay nada pendiente por entregar.</p>'}`}
  if(t==='pagados'){const l=S.orders.filter(o=>o.paid).reverse();return `<div class=bar><b>Pedidos pagados en esta jornada</b></div>${l.length?`<div class=grid>${l.map(o=>`<article class=card><header><b>${esc(o.table_name)}</b><span class="tag pagado">pagado</span></header><ul>${itemsOf(o.id).map(i=>`<li>${i.qty}× ${esc(i.name)} <em>${i.take_away?'llevar':'servir'}</em></li>`).join('')}</ul><footer><b>${money(total(o.id))}</b><small>${S.pays.filter(p=>p.order_id===o.id).map(p=>p.method).join(', ')}</small></footer></article>`).join('')}</div>`:'<p class=empty>Aún no hay pedidos pagados.</p>'}`}
  if(t==='caja'){return `<div class=bar><b>Caja de la jornada</b><button data-act=exp>Retirar de caja</button><button class=pri data-act=end>Terminar jornada</button></div><div class=scroll>${sumBox(cajaTot())}</div>
    ${S.exps.length?`<h3>Retiros</h3><div class=scroll><table>${S.exps.map(x=>`<tr><td>${esc(x.detail)}</td><td class=n>${money(x.amount)}</td></tr>`).join('')}</table></div>`:''}`}
  if(t==='productos'){return `<div class=bar><b>Productos</b><button class=pri data-act=np>+ Nuevo producto</button></div><div class=scroll><table><tr><th>Nombre</th><th>Categoría</th><th class=n>Precio</th><th></th></tr>${S.prods.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td class=n>${money(p.price)}</td><td class=n><button data-act=ep data-id=${p.id}>Editar</button> <button class=x data-act=dp data-id=${p.id}>Eliminar</button></td></tr>`).join('')}</table></div>`}
}
function render(){
  if(!S.u)return;
  const tabs=PERMS[S.u.role]||PERMS.mesero; if(!tabs.includes(S.tab))S.tab=tabs[0];
  $('#app').innerHTML=`<header class=top><h1>Cafetería</h1><span><small>${esc(S.u.username)} · ${esc(S.u.role)}</small> <button data-act=out>Salir</button></span></header>
  <nav>${tabs.map(t=>`<button class="${t===S.tab?'on':''}" data-act=tab data-t=${t}>${TABS[t]}</button>`).join('')}</nav><main>${view()}</main>`;
}

// ---------- Pedido nuevo / agregar ----------
const dtotal=()=>Object.entries(S.d.l).reduce((a,[id,l])=>a+l.q*(S.prods.find(p=>p.id==id)?.price||0),0);
function dm(){const d=S.d;
  $('#modal').innerHTML=wrap(`<h2>${d.oid?'Agregar a '+esc(d.tn):'Nuevo pedido'}</h2>${d.oid?'':`<input placeholder="Mesa o cliente" value="${esc(d.tn)}" oninput="S.d.tn=this.value">`}
  ${S.prods.map(p=>{const l=d.l[p.id]||{q:0};return `<div class="prow ${l.q?'on':''}"><span>${esc(p.name)}<small>${money(p.price)}</small></span><label class=tk><input type=checkbox data-act=tk data-id=${p.id} ${l.t?'checked':''}>llevar</label><button data-act=mn data-id=${p.id}>−</button><b>${l.q}</b><button data-act=pl data-id=${p.id}>+</button></div>`}).join('')||'<p class=empty>No hay productos. El administrador debe crearlos.</p>'}
  <footer class=bar><b>${money(dtotal())}</b><button data-act=cm>Cancelar</button><button class=pri data-act=sd>Guardar pedido</button></footer>`);
}
async function saveDraft(){
  const d=S.d,rows=Object.entries(d.l).filter(([,l])=>l.q>0).map(([id,l])=>{const p=S.prods.find(x=>x.id==id);return{product_id:+id,name:p.name,price:p.price,qty:l.q,take_away:!!l.t,delivered:false}});
  if(!rows.length)return alert('Agrega al menos un producto.');
  let oid=d.oid;
  if(!oid){if(!d.tn.trim())return alert('Escribe la mesa o el cliente.');
    const r=await sb.from('orders').insert({table_name:d.tn.trim()}).select().single();if(fail(r))return;oid=r.data.id}
  if(fail(await sb.from('order_items').insert(rows.map(r=>({...r,order_id:oid})))))return;
  closeM();load();
}

// ---------- Pago ----------
const units=oid=>itemsOf(oid).flatMap(i=>Array.from({length:i.qty},()=>({n:i.name,p:+i.price,t:i.take_away})));
const ptot=k=>{const u=units(S.p.oid);return u.reduce((a,x,i)=>a+(S.p.a[i]===k?x.p:0),0)};
function chg(k){const p=S.p,t=ptot(k),r=+p.rc[k]||0,d=r-t;return p.mt[k]==='efectivo'?(d>=0?`Cambio a entregar: ${money(d)}`:`Falta: ${money(-d)}`):'Solo se registra la transferencia'}
function pm(){const p=S.p,u=units(p.oid),all=u.reduce((a,x)=>a+x.p,0);let h;
  if(!p.mode)h=`<h2>Pagar · ${money(all)}</h2><p>¿Cómo van a pagar?</p><div class=seg><button class=pri data-act=pmode data-v=single>Una sola cuenta</button><button data-act=pmode data-v=split>Cuenta dividida</button></div><button data-act=cm>Cancelar</button>`;
  else if(!p.n)h=`<h2>Cuenta dividida</h2><label>¿Entre cuántas personas?<input id=np type=number min=2 value=2 inputmode=numeric></label><div class=seg><button data-act=pback>Atrás</button><button class=pri data-act=pn>Continuar</button></div>`;
  else{const person=k=>`<div class=box data-p=${k}><h4><span>${p.mode==='split'?'Persona '+(k+1):'Cuenta única'}</span><b id=pt${k}>${money(ptot(k))}</b></h4>
    ${p.mode==='split'?`<div class=chips>${u.map((x,i)=>p.a[i]===k?`<span class="chip ${S.sel===i?'sel':''}" draggable=true data-u=${i}>${esc(x.n)} ${money(x.p)}</span>`:'').join('')}</div>`:''}
    <div class=seg><button class="${p.mt[k]==='efectivo'?'on':''}" data-act=mt data-k=${k} data-v=efectivo>Efectivo</button><button class="${p.mt[k]==='transferencia'?'on':''}" data-act=mt data-k=${k} data-v=transferencia>Transferencia</button></div>
    ${p.mt[k]==='efectivo'?`<input type=number inputmode=decimal step=0.01 placeholder="Valor recibido" value="${p.rc[k]??''}" oninput="S.p.rc[${k}]=this.value;$('#cg${k}').textContent=chg(${k})">`:''}<div class=chg id=cg${k}>${chg(k)}</div></div>`;
    h=`<h2>${p.mode==='split'?'Dividir cuenta · '+money(all):'Cuenta única · '+money(all)}</h2>${p.mode==='split'?`<p>Arrastra cada producto a una persona (o toca el producto y luego la persona).</p><div class="box pool" data-p=-1><h4>Sin asignar</h4><div class=chips>${u.map((x,i)=>p.a[i]===-1?`<span class="chip ${S.sel===i?'sel':''}" draggable=true data-u=${i}>${esc(x.n)} ${money(x.p)}</span>`:'').join('')}</div></div>`:''}
    <div class=boards>${Array.from({length:p.n},(_,k)=>person(k)).join('')}</div><div class=bar><button data-act=cm>Cancelar</button><button class=pri data-act=sp>Guardar pago</button></div>`}
  $('#modal').innerHTML=wrap(h);
}
async function savePay(){
  const p=S.p;if(p.a.includes(-1))return alert('Asigna todos los productos a una persona.');
  const rows=[];for(let k=0;k<p.n;k++){const t=ptot(k);if(t<=0)continue;const r=+p.rc[k]||0;
    if(p.mt[k]==='efectivo'&&r<t)return alert(`Persona ${k+1}: el valor recibido es menor al total.`);
    rows.push({order_id:p.oid,person:k+1,method:p.mt[k],amount:t,received:p.mt[k]==='efectivo'?r:null,change_given:p.mt[k]==='efectivo'?r-t:null})}
  if(fail(await sb.from('payments').insert(rows)))return;
  if(fail(await sb.from('orders').update({paid:true,paid_at:new Date().toISOString()}).eq('id',p.oid)))return;
  closeM();load();
}

// ---------- Eventos ----------
function assign(i,k){S.p.a[i]=k;S.sel=null;pm()}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');
  if(!t){const c=e.target.closest('.chip'),b=e.target.closest('.box');
    if(c){S.sel=S.sel===+c.dataset.u?null:+c.dataset.u;pm()}else if(b&&S.sel!==null)assign(S.sel,+b.dataset.p);return}
  const a=t.dataset.act,id=+t.dataset.id,D=t.dataset;
  if(a==='in'){const r=await sb.auth.signInWithPassword({email:$('#lu').value.trim().toLowerCase()+DOM,password:$('#lp').value});
    if(r.error)return $('#le').textContent='Usuario o clave incorrectos.';return start()}
  if(a==='out'){await sb.auth.signOut();S.u=null;return login()}
  if(a==='tab'){S.tab=D.t;return render()}
  if(a==='cm')return closeM();
  if(a==='tg'){await sb.from('order_items').update({delivered:t.checked}).eq('id',id);return load()}
  if(a==='di'){if(confirm('¿Quitar este producto del pedido?')){await sb.from('order_items').delete().eq('id',id);load()}return}
  if(a==='do'){if(confirm('¿Eliminar el pedido completo?')){await sb.from('orders').delete().eq('id',id);load()}return}
  if(a==='new'){S.d={oid:null,tn:'',l:{}};return dm()}
  if(a==='add'){S.d={oid:id,tn:S.orders.find(o=>o.id===id).table_name,l:{}};return dm()}
  if(a==='pl'||a==='mn'){const l=S.d.l[id]||(S.d.l[id]={q:0});l.q=Math.max(0,l.q+(a==='pl'?1:-1));return dm()}
  if(a==='tk'){(S.d.l[id]||(S.d.l[id]={q:0})).t=t.checked;return}
  if(a==='sd')return saveDraft();
  if(a==='pay'){S.p={oid:id,mode:null,n:0,a:[],mt:[],rc:[]};return pm()}
  if(a==='pmode'){const u=units(S.p.oid);S.p.mode=D.v;if(D.v==='single'){S.p.n=1;S.p.a=u.map(()=>0);S.p.mt=['efectivo']}else{S.p.a=u.map(()=>-1)}return pm()}
  if(a==='pback'){S.p.mode=null;return pm()}
  if(a==='pn'){const n=Math.min(20,Math.max(2,+$('#np').value||2));S.p.n=n;S.p.mt=Array(n).fill('efectivo');return pm()}
  if(a==='mt'){S.p.mt[+D.k]=D.v;return pm()}
  if(a==='sp')return savePay();
  if(a==='np'||a==='ep'){const p=S.prods.find(x=>x.id===id)||{name:'',price:'',category:'General'};S.d={pid:a==='ep'?id:null};
    $('#modal').innerHTML=wrap(`<h2>${a==='ep'?'Editar':'Nuevo'} producto</h2><label>Nombre<input id=pn value="${esc(p.name)}"></label><label>Categoría<input id=pc value="${esc(p.category)}"></label><label>Precio<input id=pp type=number step=0.01 inputmode=decimal value="${p.price}"></label><div class=bar><button data-act=cm>Cancelar</button><button class=pri data-act=spr>Guardar</button></div>`);return}
  if(a==='spr'){const v={name:$('#pn').value.trim(),category:$('#pc').value.trim()||'General',price:+$('#pp').value};if(!v.name||!(v.price>=0)||$('#pp').value==='')return alert('Completa nombre y precio.');
    const r=S.d.pid?await sb.from('products').update(v).eq('id',S.d.pid):await sb.from('products').insert(v);if(fail(r))return;closeM();return load()}
  if(a==='dp'){if(confirm('¿Eliminar este producto? Los pedidos existentes conservan su nombre y precio.')){fail(await sb.from('products').delete().eq('id',id));load()}return}
  if(a==='exp'){$('#modal').innerHTML=wrap(`<h2>Retirar dinero de caja</h2><label>Monto<input id=ea type=number step=0.01 inputmode=decimal></label><label>Detalle de la compra<input id=ed></label><div class=bar><button data-act=cm>Cancelar</button><button class=pri data-act=se>Guardar retiro</button></div>`);return}
  if(a==='se'){const amount=+$('#ea').value,detail=$('#ed').value.trim();if(!(amount>0)||!detail)return alert('Escribe el monto y el detalle.');
    if(fail(await sb.from('expenses').insert({amount,detail})))return;closeM();return load()}
  if(a==='end'){const open=S.orders.filter(o=>!o.paid).length;
    $('#modal').innerHTML=wrap(`<h2>Terminar jornada</h2>${open?`<p class=err>Hay ${open} pedido(s) sin pagar; seguirán en la cola.</p>`:''}${sumBox(cajaTot())}<div class=bar><button data-act=cm>Cancelar</button><button class=pri data-act=close>Cerrar jornada</button></div>`);return}
  if(a==='close'){const T=cajaTot(),r=await sb.from('shifts').insert({closed_by:S.u.id,total_cash:T.cash,total_transfer:T.tr,total_expenses:T.ex}).select().single();if(fail(r))return;
    const s=r.data.id;await Promise.all([sb.from('payments').update({shift_id:s}).is('shift_id',null),sb.from('expenses').update({shift_id:s}).is('shift_id',null),sb.from('orders').update({shift_id:s}).eq('paid',true).is('shift_id',null)]);
    $('#modal').innerHTML=wrap(`<h2>Jornada cerrada</h2>${sumBox(T)}<button class=pri data-act=cm>Listo</button>`);return load()}
});
// Arrastrar y soltar
document.addEventListener('dragstart',e=>{const c=e.target.closest('.chip');if(c)e.dataTransfer.setData('text',c.dataset.u)});
document.addEventListener('dragover',e=>{if(e.target.closest('.box'))e.preventDefault()});
document.addEventListener('drop',e=>{const b=e.target.closest('.box');if(!b||!S.p)return;e.preventDefault();const i=+e.dataTransfer.getData('text');if(!isNaN(i))assign(i,+b.dataset.p)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.u&&e.target.id==='lp')document.querySelector('[data-act=in]').click()});
start();
</script></body></html>
