<script>

let S={staff:{},h:{shifts:[],open:{},d:{},ord:{}},users:[],logs:[],u:null,tab:'pedidos',prods:[],orders:[],items:[],pays:[],exps:[],d:null,p:null,sel:null};

// Actualiza solo lo que cambió (sin redibujar toda la pantalla)
function syncAttrs(x,y){if(x.tagName==='MAIN')return;
  [...x.attributes].forEach(({name})=>{if(!y.hasAttribute(name)&&!(name==='style'&&(x.getAttribute('style')||'').includes('--i'))&&!(name==='open'&&x.tagName==='DETAILS'))x.removeAttribute(name)});
  [...y.attributes].forEach(({name,value})=>{if(x.getAttribute(name)!==value)x.setAttribute(name,value)});
  if(x.tagName==='INPUT'){if(x.type==='checkbox'||x.type==='radio'){if(x.checked!==y.checked)x.checked=y.checked}else if(x!==document.activeElement&&x.value!==y.value)x.value=y.value}}
function morph(a,b){const ac=[...a.childNodes],bc=[...b.childNodes],n=Math.max(ac.length,bc.length);
  for(let i=0;i<n;i++){const x=ac[i],y=bc[i];
    if(!y){x.remove();continue}
    if(!x){a.appendChild(y);continue}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y,x);continue}
    if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
    syncAttrs(x,y);morph(x,y)}}

  const t=document.createElement('div');t.innerHTML=html;morph(app,t)}
function render(){
  document.body.classList.remove('busy');if(S.u&&S.u.role)applyShield();const y=scrollY,nl=$('nav')?.scrollLeft||0,ae=document.activeElement,aid=ae&&ae.id,ss=ae&&ae.selectionStart,ls=[...document.querySelectorAll('.lim')].map(e=>e.scrollTop);
  if(!S.u)return;
  const tabs=[...(PERMS[S.u.role]||PERMS.mesero),'perfil']; if(!tabs.includes(S.tab))S.tab=tabs[0];
  const html=`<header class=top><h1>Cafetería</h1><span><small>${esc(S.u.username)} · ${esc(S.u.role)}</small> <button class=out data-act=out aria-label="Cerrar sesión"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Cerrar sesión</button></span></header>
  <nav>${tabs.map(t=>`<button class="${t===S.tab?'on':''}" data-act=tab data-t=${t}>${TABS[t]}</button>`).join('')}</nav><main class="${S.anim?'in':''}">${view()}</main>`;
  patch(html);
  scrollTo(0,S.anim?0:y);if($('nav'))$('nav').scrollLeft=nl;S.anim=false;
  document.querySelectorAll('.lim').forEach((e,i)=>{e.scrollTop=ls[i]||0});
  if(aid){const el=document.getElementById(aid);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{el.setSelectionRange(ss,ss)}catch(e){}}}
  document.querySelectorAll('main .card,main tr').forEach((el,i)=>el.style.setProperty('--i',Math.min(i,12)));
}

// ---------- Pedido nuevo / agregar ----------
const pr=(p,t)=>+p.price+(t?+p.take_extra||0:0);
const dtotal=()=>Object.entries(S.d.l).reduce((a,[id,l])=>{const p=S.prods.find(x=>x.id==id);return a+(p?l.q*pr(p,l.t):0)},0);
function fp(v){S.pq=v;const q=norm(v.trim());let n=0;document.querySelectorAll('#ptab tr[data-n]').forEach(r=>{const h=!!q&&!r.dataset.n.includes(q);r.hidden=h;if(!h)n++});$('#pnr').hidden=n>0;$('#pc').textContent=q?`(${n} de ${S.prods.length})`:`(${S.prods.length})`}
function fq(v){S.d.q=v;const q=norm(v.trim());let n=0;document.querySelectorAll('.prow').forEach(r=>{const h=!!q&&!r.dataset.n.includes(q);r.hidden=h;if(!h)n++});$('#nr').hidden=n>0}
function dm(){const d=S.d;
  setM(`<h2>${d.oid?'Agregar a '+esc(d.tn):'Nuevo pedido'}</h2>${d.oid?'':`<input placeholder="Mesa o cliente" value="${esc(d.tn)}" oninput="S.d.tn=this.value">`}
  <div class=srch><input type=search id=sq placeholder="Buscar producto…" autocomplete=off enterkeyhint=search value="${esc(d.q||'')}" oninput="fq(this.value)"></div>
  ${S.prods.map(p=>{const l=d.l[p.id]||{q:0};return `<div class="prow ${l.q?'on':''}" data-n="${esc(norm(p.name+' '+p.category))}" ${!d.q||norm(p.name+' '+p.category).includes(norm(d.q.trim()))?'':'hidden'}><span>${esc(p.name)}<small>${money(pr(p,l.t))}${+p.take_extra&&!l.t?' · llevar '+money(pr(p,1)):''}</small></span><label class=tk><input type=checkbox data-act=tk data-id=${p.id} ${l.t?'checked':''}>llevar</label><button data-act=mn data-id=${p.id}>−</button><b>${l.q}</b><button data-act=pl data-id=${p.id}>+</button></div>`}).join('')||'<p class=empty>No hay productos. El administrador debe crearlos.</p>'}
  <p class=empty id=nr hidden>Ningún producto coincide.</p><footer class=bar><b>${money(dtotal())}</b><button data-act=cm>Cancelar</button><button class=pri data-act=sd>Guardar pedido</button></footer>`);
}
async function saveDraft(){
  const d=S.d,rows=Object.entries(d.l).filter(([,l])=>l.q>0).map(([id,l])=>{const p=S.prods.find(x=>x.id==id);return{product_id:+id,name:p.name,price:pr(p,l.t),qty:l.q,take_away:!!l.t,delivered:false}});
  if(!rows.length)return alert('Agrega al menos un producto.');
  let oid=d.oid;
  if(!oid){if(!d.tn.trim())return alert('Escribe la mesa o el cliente.');
    const r=await sb.from('orders').insert({table_name:d.tn.trim()}).select().single();if(fail(r))return;oid=r.data.id}
  if(fail(await sb.from('order_items').insert(rows.map(r=>({...r,order_id:oid})))))return;
  if(d.oid&&S.orders.find(o=>o.id===oid)?.paid)await sb.from('orders').update({paid:false}).eq('id',oid);
  closeM();load();
}

// ---------- Pago ----------
const ASKMSG='Este pedido tiene productos para llevar.\n\n¿Ya se los entregaste al cliente?\n\nAceptar = Sí, ya los entregué\nCancelar = No (no se hace nada)';
const units=oid=>itemsOf(oid).filter(i=>S.p.ids.includes(i.id)).flatMap(i=>Array.from({length:i.qty},()=>({n:i.name,p:+i.price,t:i.take_away})));
const ptot=k=>{const u=units(S.p.oid);return u.reduce((a,x,i)=>a+(S.p.a[i]===k?x.p:0),0)};
function chg(k){const p=S.p,t=ptot(k),r=num(p.rc[k]),d=r-t;return p.mt[k]==='efectivo'?(d>=0?`Cambio a entregar: ${money(d)}`:`Falta: ${money(-d)}`):'Solo se registra la transferencia'}
function pm(){const p=S.p,u=units(p.oid),all=u.reduce((a,x)=>a+x.p,0);let h;
  if(!p.mode)h=`<h2>Pagar · ${money(all)}</h2>${paidAmt(p.oid)>0?`<p>Ya se cobró ${money(paidAmt(p.oid))}; aquí se cobra solo lo pendiente.</p>`:''}<p>¿Cómo van a pagar?</p><div class=seg><button class=pri data-act=pmode data-v=single>Una sola cuenta</button><button data-act=pmode data-v=split>Cuenta dividida</button></div><button data-act=cm>Cancelar</button>`;
  else if(!p.n)h=`<h2>Cuenta dividida</h2><label>¿Entre cuántas personas?<input id=np type=number min=2 value=2 inputmode=numeric></label><div class=seg><button data-act=pback>Atrás</button><button class=pri data-act=pn>Continuar</button></div>`;
  else{const person=k=>`<div class="box ${S.sel!==null?'hot':''}" data-p=${k}><h4><span>${p.mode==='split'?'Persona '+(k+1):'Cuenta única'}</span><b id=pt${k}>${money(ptot(k))}</b></h4>
    ${p.mode==='split'?`<div class=chips>${u.map((x,i)=>p.a[i]===k?`<span class="chip ${S.sel===i?'sel':''}" draggable=${FINE} data-u=${i}>${esc(x.n)} ${money(x.p)}</span>`:'').join('')}</div>`:''}
    <div class=seg><button class="${p.mt[k]==='efectivo'?'on':''}" data-act=mt data-k=${k} data-v=efectivo>Efectivo</button><button class="${p.mt[k]==='transferencia'?'on':''}" data-act=mt data-k=${k} data-v=transferencia>Transferencia</button></div>
    ${p.mt[k]==='efectivo'?`<input type=text inputmode=decimal autocomplete=off placeholder="Valor recibido" value="${p.rc[k]??''}" oninput="S.p.rc[${k}]=this.value;$('#cg${k}').textContent=chg(${k})">`:''}<div class=chg id=cg${k}>${chg(k)}</div></div>`;
    h=`<h2>${p.mode==='split'?'Dividir cuenta · '+money(all):'Cuenta única · '+money(all)}</h2>${p.mode==='split'?`<p>${FINE?'Arrastra cada producto a una persona (o toca el producto y luego la persona).':'Mantén presionado un producto y arrástralo a la persona. También puedes tocar el producto y luego tocar a la persona.'}</p><div class="box pool ${S.sel!==null?'hot':''}" data-p=-1><h4>Sin asignar</h4><div class=chips>${u.map((x,i)=>p.a[i]===-1?`<span class="chip ${S.sel===i?'sel':''}" draggable=${FINE} data-u=${i}>${esc(x.n)} ${money(x.p)}</span>`:'').join('')}</div></div>`:''}
    <div class=boards>${Array.from({length:p.n},(_,k)=>person(k)).join('')}</div><div class=bar><button data-act=cm>Cancelar</button><button class=pri data-act=sp>Guardar pago</button></div>`}
  setM(h,'pay');
}
async function savePay(){
  const p=S.p;if(p.a.includes(-1))return alert('Asigna todos los productos a una persona.');
  const rows=[];for(let k=0;k<p.n;k++){const t=ptot(k);if(t<=0)continue;const r=num(p.rc[k]);
    if(p.mt[k]==='efectivo'&&r<t)return alert(`Persona ${k+1}: el valor recibido es menor al total.`);
    rows.push({order_id:p.oid,person:k+1,method:p.mt[k],amount:t,received:p.mt[k]==='efectivo'?r:null,change_given:p.mt[k]==='efectivo'?r-t:null})}
  if(p.ask&&!p.ok){if(!confirm(ASKMSG))return closeM();p.ok=true}
  if(fail(await sb.from('payments').insert(rows)))return;
  if(p.ok){const hid=itemsOf(p.oid).filter(i=>i.take_away&&!i.handed).map(i=>i.id);if(hid.length&&fail(await sb.from('order_items').update({delivered:true,handed:true}).in('id',hid)))return}
  if(fail(await sb.from('order_items').update({paid:true}).in('id',p.ids)))return;
  const rem=await sb.from('order_items').select('id',{count:'exact',head:true}).eq('order_id',p.oid).eq('paid',false);
  if(fail(await sb.from('orders').update({paid:rem.count===0,paid_at:new Date().toISOString()}).eq('id',p.oid)))return;
  closeM();load();
}

// ---------- Eventos ----------
function assign(i,k){S.p.a[i]=k;S.sel=null;pm()}
const MUT=['sd','sp','se','spr','close','su','spf','see'];
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');
  if(t&&MUT.includes(t.dataset.act)){if(S.sv)return;S.sv=true;const h=t.innerHTML;t.disabled=true;t.innerHTML='<span class=sp></span>Guardando…';
    return onClick(e).finally(()=>{S.sv=false;if(t.isConnected){t.disabled=false;t.innerHTML=h}})}
  return onClick(e)});

  if(a==='out')return forceOut('');
  if(a==='tab'){S.tab=D.t;S.anim=true;render();if(D.t==='usuarios')loadUsers();if(D.t==='historial')loadHist();return}

  if(a==='iq'){const i=S.items.find(x=>x.id===id),d=+D.d;if(!i)return;

  if(a==='do'){const cob=itemsOf(id).some(i=>i.paid);if(cob&&S.u.role!=='admin')return alert('Este pedido ya tiene pagos registrados. Solo el administrador puede eliminarlo.');if(confirm(cob?'Este pedido tiene pagos registrados; se borrarán también y cambiará la caja. ¿Eliminarlo?':'¿Eliminar el pedido completo?')){await sb.from('orders').delete().eq('id',id);load()}return}
  if(a==='new'){S.d={oid:null,tn:'',l:{}};return dm()}
  if(a==='add'){S.d={oid:id,tn:S.orders.find(o=>o.id===id).table_name,l:{}};return dm()}
  if(a==='pl'||a==='mn'){const l=S.d.l[id]||(S.d.l[id]={q:0});l.q=Math.max(0,l.q+(a==='pl'?1:-1));return dm()}
  if(a==='tk'){(S.d.l[id]||(S.d.l[id]={q:0})).t=t.checked;return dm()}
  if(a==='sd')return saveDraft();
  if(a==='pay'){const ids=itemsOf(id).filter(i=>!i.paid).map(i=>i.id);if(!ids.length)return alert('Este pedido ya está cobrado.');const its=itemsOf(id),tk=its.filter(i=>i.take_away);S.p={oid:id,ids,ask:tk.length>0&&tk.length<its.length&&tk.every(i=>i.delivered)&&tk.some(i=>!i.handed),ok:false,mode:null,n:0,a:[],mt:[],rc:[]};return pm()}

    if(fail(await sb.from('staff').upsert(v)))return;closeM();return load()}

  if(a==='ub'){const u=S.users.find(x=>x.id===D.uid);if(!confirm(u.blocked?`¿Habilitar a ${u.username}?`:`¿Bloquear a ${u.username}? Su sesión se cerrará y no podrá ingresar.`))return;fail(await sb.from('profiles').update({blocked:!u.blocked}).eq('id',u.id));return load()}

  if(a==='np'||a==='ep'){const p=S.prods.find(x=>x.id===id)||{name:'',price:'',category:'General',take_extra:0};S.d={pid:a==='ep'?id:null};
    setM(`<h2>${a==='ep'?'Editar':'Nuevo'} producto</h2><label>Nombre<input id=pn value="${esc(p.name)}"></label><label>Categoría<input id=pcat value="${esc(p.category)}"></label><label>Precio<input id=pp type=text inputmode=decimal autocomplete=off placeholder="0.00" value="${p.price}"></label><label>Recargo para llevar (se suma al precio)<input id=pt type=text inputmode=decimal autocomplete=off placeholder="0.00" value="${p.take_extra||''}"></label><div class=bar><button data-act=cm>Cancelar</button><button class=pri data-act=spr>Guardar</button></div>`);return}
  if(a==='spr'){const v={name:$('#pn').value.trim(),category:$('#pcat').value.trim()||'General',price:num($('#pp').value),take_extra:num($('#pt').value)};if(!v.name||!(v.price>=0)||$('#pp').value==='')return alert('Completa nombre y precio.');
    const r=S.d.pid?await sb.from('products').update(v).eq('id',S.d.pid):await sb.from('products').insert(v);if(fail(r))return;closeM();return load()}

    if(a==='de'){if(!confirm('¿Eliminar este retiro? La caja se recalculará.'))return;fail(await sb.from('expenses').delete().eq('id',id));return load()}

    if(fail(await sb.from('expenses').update({amount,detail}).eq('id',S.d.eid)))return;closeM();return load()}
  if(a==='se'){const amount=num($('#ea').value),detail=$('#ed').value.trim();if(!(amount>0)||!detail)return alert('Escribe el monto y el detalle.');
    if(fail(await sb.from('expenses').insert({amount,detail})))return;closeM();return load()}
  if(a==='end'){const open=S.orders.filter(o=>!done(o)).length;
    setM(`<h2>Terminar jornada</h2>${open?`<p class=err>Hay ${open} pedido(s) sin terminar (por cobrar o por entregar); seguirán en la cola de la siguiente jornada.</p>`:''}${sumBox(cajaTot())}<div class=bar><button data-act=cm>Cancelar</button><button class=pri data-act=close>Cerrar jornada</button></div>`);return}
  if(a==='close'){const T=cajaTot(),r=await sb.from('shifts').insert({closed_by:S.u.id,total_cash:T.cash,total_transfer:T.tr,total_expenses:T.ex}).select().single();if(fail(r))return;
    const s=r.data.id;await Promise.all([sb.from('payments').update({shift_id:s}).is('shift_id',null),sb.from('expenses').update({shift_id:s}).is('shift_id',null),sb.from('orders').update({shift_id:s}).in('id',S.orders.filter(done).map(o=>o.id)).is('shift_id',null)]);
    setM(`<h2>Jornada cerrada</h2>${sumBox(T)}<button class=pri data-act=cm>Listo</button>`);return load()}
}
// Arrastrar y soltar
document.addEventListener('dragstart',e=>{const c=e.target.closest('.chip');if(c)e.dataTransfer.setData('text',c.dataset.u)});
document.addEventListener('dragover',e=>{if(e.target.closest('.box'))e.preventDefault()});
document.addEventListener('drop',e=>{const b=e.target.closest('.box');if(!b||!S.p)return;e.preventDefault();const i=+e.dataTransfer.getData('text');if(!isNaN(i))assign(i,+b.dataset.p)});
// Arrastre táctil (iPhone/Android): mantener presionado un producto y arrastrar
let T=null;
const gpos=(x,y)=>{T.g.style.left=x+'px';T.g.style.top=y+'px'};
const tEnd=()=>{if(!T)return;clearTimeout(T.tm);clearInterval(T.sc);if(T.g)T.g.remove();document.querySelectorAll('.over').forEach(b=>b.classList.remove('over'));T.c.classList.remove('lift');T=null};
document.addEventListener('touchstart',e=>{const c=e.target.closest('.chip');if(!c||!S.p||e.touches.length>1)return;tEnd();const t=e.touches[0];
  T={u:+c.dataset.u,x:t.clientX,y:t.clientY,c,on:false,dy:0,tm:setTimeout(()=>{if(!T)return;T.on=true;T.g=c.cloneNode(true);T.g.className='chip ghost';document.body.appendChild(T.g);gpos(T.x,T.y);c.classList.add('lift');
    T.sc=setInterval(()=>{const sh=document.querySelector('#modal .sheet');if(sh&&T&&T.dy)sh.scrollTop+=T.dy},16)},250)}},{passive:true});
document.addEventListener('touchmove',e=>{if(!T)return;const t=e.touches[0];
  if(!T.on){if(Math.hypot(t.clientX-T.x,t.clientY-T.y)>10)tEnd();return}
  e.preventDefault();T.x=t.clientX;T.y=t.clientY;gpos(T.x,T.y);
  document.querySelectorAll('.over').forEach(b=>b.classList.remove('over'));
  const b=document.elementFromPoint(T.x,T.y)?.closest('.box');if(b)b.classList.add('over');
  const pool=document.querySelector('.pool'),pb=pool?pool.getBoundingClientRect().bottom:0;
  T.dy=T.y>innerHeight-110?12:(T.y<pb+40&&T.y>pb-5?-12:0)},{passive:false});
document.addEventListener('touchend',e=>{if(!T)return;
  if(T.on){if(e.cancelable)e.preventDefault();const t=e.changedTouches[0],b=document.elementFromPoint(t.clientX,t.clientY)?.closest('.box'),u=T.u;tEnd();if(b&&b.dataset.p!==undefined)assign(u,+b.dataset.p);return}
  tEnd()},{passive:false});
document.addEventListener('touchcancel',tEnd);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.u&&e.target.id==='lp')document.querySelector('[data-act=in]').click()});
// Protección anti-captura (disuasiva): no puede bloquear capturas del sistema operativo ni fotos con otra cámara
const shield=()=>document.body.classList.contains('shield');
addEventListener('blur',()=>{if(shield())cover(true)});
addEventListener('focus',()=>cover(false));
document.addEventListener('visibilitychange',()=>{if(shield())cover(document.hidden)});
document.addEventListener('keydown',e=>{if(!shield())return;
  const hit=e.key==='PrintScreen'||(e.metaKey&&e.shiftKey&&['KeyS','Digit3','Digit4','Digit5'].includes(e.code))||((e.ctrlKey||e.metaKey)&&['KeyP','KeyS'].includes(e.code));
  if(hit){e.preventDefault();attempt()}});
document.addEventListener('keyup',e=>{if(shield()&&e.key==='PrintScreen')attempt()});
document.addEventListener('contextmenu',e=>{if(shield()&&!e.target.closest('input,textarea'))e.preventDefault()});
addEventListener('beforeprint',()=>{if(shield())attempt()});
// Actualización automática: al volver a la pestaña, recuperar internet o reabrir la página
document.addEventListener('visibilitychange',resync);addEventListener('focus',resync);addEventListener('online',resync);addEventListener('pageshow',resync);
start();
</script></body></html>
